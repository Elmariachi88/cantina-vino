name: Sonda negozi
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe.mjs', '.github/workflows/sonda.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/probe.mjs
      - run: |
          git config user.name "cantina-bot"
          git config user.email "cantina-bot@users.noreply.github.com"
          git add radar/_probe.json
          git commit -m "Sonda negozi: esito" || exit 0
          git pull --rebase origin main && git push
